services:
  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: base44-jupyter
    user: "0:0"
    working_dir: /home/jovyan/work
    environment:
      - HOME=/home/jovyan
      - JUPYTER_TOKEN=
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
    volumes:
      - ./:/home/jovyan/work
    ports:
      - "3000:8888"
    command:
      [
        "sh",
        "-ec",
        "pip install --no-cache-dir --quiet --root-user-action=ignore 'numba>=0.58' yfinance pandas-datareader plotly pyfolio bt && exec jupyter lab --ip=0.0.0.0 --port=8888 --IdentityProvider.token='' --ServerApp.allow_origin='*' --ServerApp.allow_remote_access=True --ServerApp.tornado_settings='{\"headers\":{\"Content-Security-Policy\":\"*\"}}' --ServerApp.disable_check_xsrf=True --ServerApp.allow_root=True",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8888/api/status || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure
